<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<title>panel</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6fa;
    --glow: rgba(76, 141, 255, .10);
    --card: #ffffff;
    --border: rgba(15, 23, 42, .08);
    --text: #10141c;
    --muted: #6b7484;
    --accent: #2f6fed;
    --accent-soft: rgba(47, 111, 237, .10);
    --ok: #199e6a;
    --err: #d64545;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e14;
      --glow: rgba(76, 141, 255, .16);
      --card: #151a24;
      --border: rgba(255, 255, 255, .08);
      --text: #e8ecf4;
      --muted: #8b94a7;
      --accent: #5b8dff;
      --accent-soft: rgba(91, 141, 255, .16);
      --ok: #3ecf8e;
      --err: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    background-image: radial-gradient(600px 320px at 50% -10%, var(--glow), transparent 70%);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(100%, 380px);
    padding: 30px 26px 22px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--card);
    box-shadow: 0 18px 50px -22px rgba(0, 0, 0, .35);
    text-align: center;
  }
  .mark {
    width: 52px; height: 52px;
    margin: 0 auto 14px;
    display: grid; place-items: center;
    border-radius: 15px;
    background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #8b5cf6));
    box-shadow: 0 8px 22px -8px var(--accent);
  }
  .mark svg { width: 26px; height: 26px; stroke: #fff; }
  h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .sub { margin: 3px 0 22px; font-size: 13px; color: var(--muted); }
  .status {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    min-height: 22px;
    margin-bottom: 18px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
    flex: none;
  }
  body[data-state="ready"]  .dot { background: var(--ok); animation: none; }
  body[data-state="failed"] .dot { background: var(--err); animation: none; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  .btn {
    display: block; width: 100%;
    padding: 12px 16px;
    border: 0; border-radius: 13px;
    background: var(--accent);
    color: #fff;
    font: inherit; font-size: 15px; font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: filter .15s ease, transform .05s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn:hover { filter: brightness(1.08); }
  .btn[hidden] { display: none; }
  .ghost {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px; font-weight: 550;
    text-decoration: none;
  }
  .hint { margin: 16px 2px 0; font-size: 12px; line-height: 1.7; color: var(--muted); }
  footer { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }
  footer code { font-family: var(--mono); }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body data-state="resolving">
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5 8 9 12 5 16"></polyline>
        <line x1="12" y1="16" x2="19" y2="16"></line>
      </svg>
    </div>
    <h1>Tmux Panel</h1>
    <p class="sub">中继跳转 · 自动定位当前内网地址</p>

    <p class="status" id="status" role="status"><span class="dot"></span><span id="status-text">正在解析面板地址…</span></p>

    <a class="btn" id="go" hidden>进入面板</a>

    <a class="ghost" href="ca.crt" download>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><path d="M4 21h16"></path>
      </svg>
      下载 CA 证书
    </a>
    <p class="hint">CA 证书只需在手机上安装一次，之后访问不再出现证书告警。</p>

    <footer>地址经 <code>DoH</code> 实时查询 · 记录于 <code>Duck DNS</code></footer>
  </main>

<script>
// The panel's LAN IP changes (and the machine roams between networks), and
// browser localStorage is per-origin, so a session token stored under the old
// IP is unreachable under the new one. This page keeps a copy of the token in
// ITS origin and re-seeds the panel origin via a URL fragment on every hop.
const NAME = 'tmux-panel.duckdns.org';
const PORT = 7681;
const TOKEN_KEY = 'panel_relay_token';
const ENDPOINTS = [
  'https://dns.alidns.com/resolve?name=' + NAME + '&type=A',
  'https://dns.google/resolve?name=' + NAME + '&type=A'
];
const body = document.body;
const statusText = document.getElementById('status-text');
const goBtn = document.getElementById('go');
const hash = location.hash || '';

function setState(state, text) {
  body.dataset.state = state;
  statusText.textContent = text;
}

function readStoredToken() {
  try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
}

// Role 1 — deposit: the panel bounces here right after a relayed login so this
// origin's copy stays fresh, then we hand the token straight back.
const storeMatch = /[#&]store=([^&]+)(?:&return=([^&]+))?/.exec(hash);
if (storeMatch) {
  const token = decodeURIComponent(storeMatch[1]);
  const back = storeMatch[2] ? decodeURIComponent(storeMatch[2]) : '/';
  try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
  setState('ready', '会话已保存，正在返回…');
  location.replace(back + '#handoff=' + encodeURIComponent(token));
} else {
  // Role 2 — relay: resolve the current IP and hop to the panel, carrying the
  // stored token if we have one, otherwise asking for a relayed login.
  (async () => {
    const saved = readStoredToken();
    for (const url of ENDPOINTS) {
      try {
        const res = await fetch(url);
        if (!res.ok) continue;
        const bodyJson = await res.json();
        const answer = (bodyJson.Answer || []).find(a => a.type === 1);
        if (!answer) continue;
        const target = saved
          ? 'https://' + answer.data + ':' + PORT + '/#handoff=' + encodeURIComponent(saved)
          : 'https://' + answer.data + ':' + PORT + '/login.html?relay=1';
        setState('ready', answer.data + ':' + PORT + ' · 正在进入…');
        goBtn.href = target;
        goBtn.hidden = false;
        location.replace(target);
        return;
      } catch (e) { /* try the next resolver */ }
    }
    setState('failed', '解析失败，请检查网络');
    goBtn.hidden = true;
    const retry = document.createElement('button');
    retry.className = 'btn';
    retry.textContent = '重试';
    retry.style.marginTop = '4px';
    retry.onclick = () => location.reload();
    goBtn.parentNode.insertBefore(retry, goBtn.nextSibling);
  })();
}
</script>
</body>
</html>
